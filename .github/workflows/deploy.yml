name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, but never kill one that is already running.
# With cancel-in-progress: true, two pushes landing close together can abort a
# deploy mid-flight and leave an older commit as the active deployment.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # env.js is gitignored, so it does not exist in the checkout. Build it
      # from repository secrets. Note this file IS served to visitors — the anon
      # key is public by necessity. This keeps it out of git, not out of the
      # browser. Repository -> Settings -> Secrets and variables -> Actions.
      - name: Generate env.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY repository secrets must be set."
            exit 1
          fi
          cat > site/assets/js/env.js <<EOF
          // Generated at deploy time. Do not edit.
          window.ENV = {
              SUPABASE_URL: '${SUPABASE_URL}',
              SUPABASE_ANON_KEY: '${SUPABASE_ANON_KEY}'
          };
          EOF
          echo "Wrote site/assets/js/env.js"

      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
